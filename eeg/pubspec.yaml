name: vitaltrack_eeg
description: "VitalTrack EEG SDK: connect to VitalTrack EEG boards and receive clean EEG, electrode contact, band power, motion and battery state."
version: 0.1.1
publish_to: 'none'

environment:
  sdk: ^3.10.4
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  meta: ^1.16.0
  universal_ble: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Each platform bundles the prebuilt core library:
  #   android/src/main/jniLibs/<abi>/libvitaltrack_core.so
  #   linux/lib/libvitaltrack_core.so
  #   windows/lib/vitaltrack_core.dll
  #   ios/Frameworks/VitalTrackCore.xcframework
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
